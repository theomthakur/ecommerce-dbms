# dbt project configuration

name: 'ecommerce_analytics'
version: '1.0.0'
config-version: 2

profile: 'ecommerce'

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecommerce_analytics:
    # Staging models (1:1 with source tables)
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
      +pre-hook: "{{ log('Running staging models...', info=true) }}"
    
    # Mart models (business logic, aggregations)
    marts:
      +materialized: table
      +schema: marts
      +tags: ['marts']
      +post-hook: "{{ log('Mart model completed: ' ~ this.name, info=true) }}"
      
      core:
        +materialized: table
        +tags: ['core']
      
      finance:
        +materialized: table
        +tags: ['finance']
      
      marketing:
        +materialized: table
        +tags: ['marketing']

seeds:
  +schema: seeds

on-run-start:
  - "{{ log('dbt run started', info=true) }}"

on-run-end:
  - "{{ log('dbt run completed', info=true) }}"

require-dbt-version: [">=1.5.0", "<2.0.0"]

vars:
  start_date: '2020-01-01'
  end_date: '2024-12-31'
  currency: 'USD'

"""Great Expectations config.yml template"""

config_version: 3.0

datasources:
  ecommerce_datasource:
    execution_engine:
      module_name: great_expectations.execution_engine
      class_name: SqlAlchemyExecutionEngine
    data_connectors:
      postgres_connector:
        module_name: great_expectations.datasource.data_connector
        class_name: SqlAlchemyDataConnector
        connection_string: "postgresql://user:password@localhost:5432/ecommerce_dw"
        assets:
          orders:
            schema_name: public
            table_name: orders
          customers:
            schema_name: public
            table_name: customers
          products:
            schema_name: public
            table_name: products
          order_items:
            schema_name: public
            table_name: order_items
          returns:
            schema_name: public
            table_name: returns

      bigquery_connector:
        module_name: great_expectations.datasource.data_connector
        class_name: SqlAlchemyDataConnector
        connection_string: "bigquery://project-id/dataset"
        assets:
          orders:
            schema_name: ecommerce_dw
            table_name: orders
          customers:
            schema_name: ecommerce_dw
            table_name: customers

store_backend_defaults:
  sqlalchemy_store:
    connection_string: "sqlite:///great_expectations/stores/store.db"
  filesystem_store:
    base_directory_path: "great_expectations/stores/filesystem_store"

stores:
  expectations_store:
    class_name: ExpectationsStore
    store_backend:
      class_name: FilesystemStoreBackend
      base_directory_path: "great_expectations/suites"

  validations_store:
    class_name: ValidationsStore
    store_backend:
      class_name: FilesystemStoreBackend
      base_directory_path: "great_expectations/validations"

  evaluation_parameter_store:
    class_name: EvaluationParameterStore

expectations_store_name: expectations_store
validations_store_name: validations_store
evaluation_parameter_store_name: evaluation_parameter_store

data_docs_sites:
  filesystem_site:
    class_name: SiteBuilder
    show_how_to_buttons: true
    store_backend:
      class_name: FilesystemStoreBackend
      base_directory_path: "great_expectations/data_docs/site"
    site_index_builder:
      class_name: DefaultSiteIndexBuilder

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: etl_user
          POSTGRES_PASSWORD: 123
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U etl_user -d ecommerce" \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5
    env:
      PG_TEST_USER: etl_user
      PG_TEST_PASS: 123
      PG_TEST_HOST: localhost
      PG_TEST_PORT: 5432
      PG_TEST_DB: ecommerce
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U etl_user; do sleep 1; done
      - name: Run unit tests
        run: |
          pytest -q tests/test_pipeline.py || true
      - name: Run integration migration parity test
        run: |
          pytest -q tests/test_integration_postgres.py -q
